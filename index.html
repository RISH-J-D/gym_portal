<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEAVEN &amp; HELL Fitness Portal</title>
    <meta name="description" content="Personal fitness coaching with Coach Kavi: personalised diet plans, weekly progress check-ins and direct coach support." />
    <meta name="theme-color" content="#080a10" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HEAVEN &amp; HELL" />
    <meta property="og:title" content="HEAVEN &amp; HELL Fitness Portal" />
    <meta property="og:description" content="Personal fitness coaching with Coach Kavi: personalised diet plans, weekly progress check-ins and direct coach support." />
    <meta property="og:url" content="https://heaven-hell-portal.vercel.app/" />
    <meta property="og:image" content="https://heaven-hell-portal.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HEAVEN &amp; HELL logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HEAVEN &amp; HELL Fitness Portal" />
    <meta name="twitter:description" content="Personal fitness coaching with Coach Kavi." />
    <meta name="twitter:image" content="https://heaven-hell-portal.vercel.app/og-image.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* Loading screen: shown from the first paint until the portal has mounted (see App.jsx). */
      html, body { margin: 0; background: #08090c; }
      #hh-splash {
        position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        padding: 24px; background: radial-gradient(ellipse at 50% 38%, rgba(225, 29, 72, .16), transparent 60%), #08090c;
        color: #b6bdca; font: 500 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; transition: opacity .35s ease, visibility .35s;
      }
      #hh-splash.is-done { opacity: 0; visibility: hidden; }
      .hh-splash-logo { width: 132px; height: auto; animation: hh-splash-pulse 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 26px rgba(225, 29, 72, .45)); }
      .hh-splash-bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
      .hh-splash-bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #e11d48; animation: hh-splash-slide 1.1s ease-in-out infinite; }
      .hh-splash-msg { margin: 0; min-height: 1.5em; letter-spacing: .02em; }
      #hh-splash.is-error .hh-splash-bar { display: none; }
      #hh-splash.is-error .hh-splash-logo { animation: none; }
      #hh-splash button { margin-top: 4px; padding: 10px 18px; border: 0; border-radius: 10px; background: #e11d48; color: #fff; font: 600 14px/1 inherit; cursor: pointer; }
      @keyframes hh-splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .82; } }
      @keyframes hh-splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .hh-splash-logo, .hh-splash-bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="hh-splash" role="status" aria-live="polite">
      <img class="hh-splash-logo" src="/logo.png" alt="HEAVEN &amp; HELL" width="132" height="134" />
      <div class="hh-splash-bar" aria-hidden="true"><i></i></div>
      <p class="hh-splash-msg">Loading your portal…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
